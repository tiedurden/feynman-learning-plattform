# Zero-install development profile: runs the backend against an in-memory H2
# database so no PostgreSQL (or Docker) is required.
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
#
# Data is discarded when the process stops. Use the default (PostgreSQL) profile
# for anything you want to keep.
spring:
  datasource:
    # PostgreSQL compatibility mode keeps entity/SQL behaviour close to prod.
    url: jdbc:h2:mem:feynman;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    # The Flyway migrations are PostgreSQL-specific, so H2 gets its schema
    # generated from the JPA entities instead.
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false


