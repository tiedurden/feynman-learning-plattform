server:
  port: 8080

spring:
  application:
    name: feynman-backend
  servlet:
    multipart:
      # Voice recordings are sent as multipart uploads; the 1MB default is far too small.
      max-file-size: ${MAX_UPLOAD_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:30MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/feynman}
    username: ${DB_USERNAME:feynman}
    password: ${DB_PASSWORD:feynman}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# Local convenience: if the PostgreSQL server above is not reachable at startup,
# the app automatically falls back to an in-memory H2 database (Flyway off,
# schema generated from the entities) so it still boots without Docker.
# Data is NOT persisted in that mode. Set this to false to fail fast instead.
app:
  datasource:
    fallback-to-h2: ${DB_FALLBACK_TO_H2:true}

# JWT signing key for local dev — override JWT_SECRET in every other environment.
jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
  access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}

openai:
  # The API key is read from the OPENAI_API_KEY environment variable.
  # Locally: set it in your shell / IntelliJ run config.
  # CI/CD: provide it via a GitHub Actions secret.
  # When mock is true, the backend uses deterministic offline scoring.
  api-key: ${OPENAI_API_KEY:}
  # Model can be overridden at runtime via the OPENAI_MODEL env var,
  # a -Dopenai.model=... JVM arg, or a profile-specific application-*.yml.
  model: ${OPENAI_MODEL:gpt-5.5}
  audio-model: ${OPENAI_AUDIO_MODEL:gpt-audio}
  transcription-model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}
  # Base URL of the OpenAI-compatible chat completions API.
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  # Explicitly choose deterministic mock scoring instead of OpenAI.
  mock: ${OPENAI_MOCK:false}
  # TLS trust store for the OpenAI HTTP client. Leave empty for JDK default.
  # On Windows the app auto-uses 'Windows-ROOT' so corporate proxy CAs are
  # trusted. Override here (e.g. to '' ) to force the JDK cacerts store.
  trust-store-type: ${OPENAI_TRUSTSTORE_TYPE:}

# Allowed frontend origin patterns for CORS (Vite dev server). Vite may move to
# the next port when the configured port is already occupied.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}

logging:
  level:
    com.feynman.backend: INFO




