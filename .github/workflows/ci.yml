name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (Maven, Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Force deterministic offline scoring in CI so tests never hit OpenAI.
      OPENAI_MOCK: "true"
      # The real key is provided as a secret for optional integration runs; it
      # is safe to be empty when OPENAI_MOCK=true.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build & test
        run: mvn -B clean verify

  frontend:
    name: Frontend (Vite/Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

